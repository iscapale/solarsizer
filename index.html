<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SolarSizer - Órbita Integrada</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; font-family: Arial, sans-serif; background: #000; }
        video { position: absolute; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        .interface { position: absolute; width: 100%; height: 100%; z-index: 2; display: flex; flex-direction: column; justify-content: space-between; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); pointer-events: none; }
        .header { background: rgba(0,0,0,0.5); padding: 15px; text-align: center; }
        .data-panel { background: rgba(0,0,0,0.6); padding: 15px; margin: 15px; border-radius: 10px; font-size: 15px; }
        
        /* Sol Virtual en Realidad Aumentada */
        #virtual-sun { 
            position: absolute; 
            width: 50px; 
            height: 50px; 
            background: radial-gradient(circle, #fff 20%, #ffeb3b 60%, rgba(255,235,59,0) 100%); 
            border-radius: 50%; 
            z-index: 4; 
            transform: translate(-50%, -50%);
            box-shadow: 0 0 20px #ff9800;
            display: none; /* Se activa si está en el rango visual */
        }
    </style>
    <!-- Inyección de la librería física SunCalc desde CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.9.0/suncalc.min.js"></script>
</head>
<body>

    <video id="webcam" autoplay playsinline></video>
    <div id="virtual-sun"></div>

    <div class="interface">
        <div class="header">
            <h2>☀️ RayScan Prototipo</h2>
            <p>Mueve el móvil para buscar el sol virtual amarillo</p>
        </div>
        
        <div class="data-panel">
            <div>📱 <strong>Tu Teléfono:</strong> Azimut: <span id="phone-az">0</span>° | Inc: <span id="phone-pitch">0</span>°</div>
            <div style="color: #ffeb3b;">🌞 <strong>Sol Real Aquí:</strong> Azimut: <span id="sun-az">0</span>° | Elevación: <span id="sun-el">0</span>°</div>
        </div>
    </div>

    <script>
        // Coordenadas de prueba (puedes cambiarlas por tu ciudad real)
        // Ejemplo: Bogotá, Colombia (Lat: 4.71, Lon: -74.07)
        const LATITUD = 4.71; 
        const LONGITUD = -74.07;

        const video = document.getElementById('webcam');
        const virtualSun = document.getElementById('virtual-sun');

        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false })
            .then(stream => { video.srcObject = stream; })
            .catch(err => { alert("Error de cámara: " + err); });

        // Variables físicas de orientación del teléfono
        let phoneAzimuth = 0;
        let phonePitch = 0;

        function handleOrientation(event) {
            phoneAzimuth = event.alpha ? Math.round(event.alpha) : 0;
            phonePitch = event.beta ? Math.round(event.beta) : 0;

            document.getElementById('phone-az').innerText = phoneAzimuth;
            document.getElementById('phone-pitch').innerText = phonePitch;

            actualizarRealidadAumentada();
        }

        function calcularPosicionSol() {
            const ahora = new Date();
            // La librería calcula la posición astronómica basándose en fórmulas físicas de la NOAA
            const infoSol = SunCalc.getPosition(ahora, LATITUD, LONGITUD);
            
            // Convertir de radianes a grados y ajustar convenciones astronómicas a brújula
            let sunAzimuthDeg = Math.round(infoSol.azimuth * (180 / Math.PI) + 180) % 360;
            let sunElevationDeg = Math.round(infoSol.altitude * (180 / Math.PI));

            document.getElementById('sun-az').innerText = sunAzimuthDeg;
            document.getElementById('sun-el').innerText = sunElevationDeg;

            return { az: sunAzimuthDeg, el: sunElevationDeg };
        }

        function actualizarRealidadAumentada() {
            const sol = calcularPosicionSol();

            // Lógica matemática de proyección en pantalla (Simplificada para pruebas)
            // Calculamos la diferencia angular entre hacia dónde apunta el móvil y dónde está el sol
            let difAzimuth = sol.az - phoneAzimuth;
            let difElevation = sol.el - phonePitch;

            // Si el teléfono apunta cerca de la posición física del sol, lo renderizamos en pantalla
            if (Math.abs(difAzimuth) < 45 && Math.abs(difElevation) < 45) {
                // Mapear los grados de diferencia a píxeles de la pantalla del celular
                let x = (window.innerWidth / 2) + (difAzimuth * 8); 
                let y = (window.innerHeight / 2) - (difElevation * 8); 

                virtualSun.style.left = x + 'px';
                virtualSun.style.top = y + 'px';
                virtualSun.style.display = 'block';
            } else {
                virtualSun.style.display = 'none';
            }
        }

        window.addEventListener('deviceorientation', handleOrientation, true);
    </script>
</body>
</html>
